services:
  # Backend API Service
  - type: web
    name: geotoken-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_GEOFENCE_RADIUS_METERS
        value: 500
      - key: CORS_ORIGINS
        value: '["*"]'

  # Frontend SPA Service
  - type: web
    name: geotoken-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
